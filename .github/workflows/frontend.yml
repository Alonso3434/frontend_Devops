      - name: Deploy frontend in EC2
        run: |
          set -e
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${{ secrets.USER_SERVER }}@${{ secrets.EC2_HOST_FRONTEND }} << EOF

            set -e

            echo "Validando Docker..."
            sudo docker --version

            echo "Autenticando en DockerHub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "Descargando última imagen del frontend..."
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/despacho-frontend:latest

            echo "Deteniendo contenedor anterior..."
            sudo docker stop despacho-frontend || true

            echo "Eliminando contenedor anterior..."
            sudo docker rm despacho-frontend || true

            echo "Levantando nuevo contenedor..."
            sudo docker run -d \
              --name despacho-frontend \
              --restart unless-stopped \
              -p 8080:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/despacho-frontend:latest

            echo "Estado del contenedor:"
            sudo docker ps --filter "name=despacho-frontend"

            echo "Validando que el contenedor esté activo..."
            sudo docker ps --format '{{.Names}}' | grep -q "despacho-frontend" || { echo "ERROR: despacho-frontend no está activo"; exit 1; }

            echo "Validando respuesta HTTP del frontend..."
            if ! command -v curl >/dev/null 2>&1; then
              echo "ERROR: curl no está instalado en la EC2"
              exit 1
            fi

            curl -f http://localhost:8080

            echo "Limpiando imágenes no utilizadas..."
            sudo docker image prune -f

            echo "Despliegue del frontend finalizado correctamente"

          EOF